<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0D1117; }
    .ground-line { stroke: #00F5FF; stroke-width: 2; stroke-dasharray: 8 6; }
    .ground-scroll {
      animation: scrollGround 1.2s linear infinite;
    }
    .dino {
      fill: #00F5FF;
      transform-box: fill-box;
      transform-origin: center;
      animation: jump 1.1s ease-in-out infinite;
    }
    .cactus {
      fill: #FF006E;
    }
    .cactus-group {
      animation: scrollObstacles 3.6s linear infinite;
    }
    .cactus-group.c2 {
      animation-delay: 1.2s;
    }
    .cactus-group.c3 {
      animation-delay: 2.4s;
    }
    .star {
      fill: #8338EC;
      opacity: 0.7;
    }
    .twinkle {
      animation: twinkle 2s ease-in-out infinite;
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      15% { transform: translateY(0); }
      35% { transform: translateY(-46px); }
      55% { transform: translateY(-46px); }
      75% { transform: translateY(0); }
    }

    @keyframes scrollObstacles {
      0% { transform: translateX(800px); }
      100% { transform: translateX(-60px); }
    }

    @keyframes scrollGround {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -140; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
  </style>

  <rect class="bg" width="800" height="200" rx="10"/>

  <!-- stars -->
  <circle class="star twinkle" cx="60" cy="30" r="1.6" style="animation-delay:0s"/>
  <circle class="star twinkle" cx="180" cy="50" r="1.2" style="animation-delay:0.4s"/>
  <circle class="star twinkle" cx="310" cy="25" r="1.8" style="animation-delay:0.8s"/>
  <circle class="star twinkle" cx="450" cy="45" r="1.3" style="animation-delay:1.2s"/>
  <circle class="star twinkle" cx="590" cy="30" r="1.6" style="animation-delay:0.6s"/>
  <circle class="star twinkle" cx="700" cy="55" r="1.2" style="animation-delay:1.6s"/>

  <!-- ground -->
  <line class="ground-line ground-scroll" x1="0" y1="160" x2="800" y2="160"/>

  <!-- dino, positioned so its feet sit on the ground line -->
  <g class="dino" transform="translate(70,112)">
    <rect x="0" y="0" width="34" height="24" rx="3"/>
    <rect x="24" y="-14" width="18" height="18" rx="3"/>
    <rect x="34" y="-10" width="6" height="4"/>
    <rect x="2" y="24" width="8" height="10"/>
    <rect x="20" y="24" width="8" height="10"/>
    <rect x="-8" y="6" width="10" height="5"/>
  </g>

  <!-- obstacle set 1 -->
  <g class="cactus-group c1">
    <rect class="cactus" x="0" y="120" width="10" height="40" rx="2"/>
    <rect class="cactus" x="-8" y="130" width="8" height="10" rx="2"/>
    <rect class="cactus" x="10" y="126" width="8" height="10" rx="2"/>
  </g>

  <!-- obstacle set 2 -->
  <g class="cactus-group c2">
    <rect class="cactus" x="0" y="128" width="8" height="32" rx="2"/>
    <rect class="cactus" x="14" y="120" width="8" height="40" rx="2"/>
  </g>

  <!-- obstacle set 3 -->
  <g class="cactus-group c3">
    <rect class="cactus" x="0" y="132" width="10" height="28" rx="2"/>
    <rect class="cactus" x="-9" y="140" width="7" height="8" rx="2"/>
  </g>
</svg>
